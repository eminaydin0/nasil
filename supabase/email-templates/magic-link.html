<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş bağlantısı</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f4;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f5f5f4;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:520px;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e7e5e4;">
          <tr>
            <td style="background:linear-gradient(135deg,#f97316 0%,#ea580c 100%);padding:28px 32px;text-align:center;">
              <p style="margin:0;font-size:22px;font-weight:800;color:#ffffff;">Kuralı Ne?</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:800;color:#1c1917;">Giriş yap</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.65;color:#57534e;">
                Tek tıkla giriş yapmak için aşağıdaki butona tıkla. Bu bağlantı kısa süre geçerlidir.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td align="center" style="padding:8px 0 20px;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;background:#ea580c;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;padding:14px 32px;border-radius:12px;">
                      Giriş yap
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:12px;word-break:break-all;">
                <a href="{{ .ConfirmationURL }}" style="color:#ea580c;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
